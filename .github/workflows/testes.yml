name: Testes e evals

# Roda em todo pull request e em todo push na main:
#  - pytest, em duas versões do Python (o projeto declara suporte a 3.10 ou mais novo);
#  - os evals, com a trava de regressão: cada caso é comparado com evals/baseline.json, e um acerto que vira
#    erro (ou um caso que some) reprova. Veja evals/README.md.
on:
  pull_request:
  push:
    branches: [main]

# Cancela a execução anterior da mesma branch quando chega um commit novo.
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

# Só leitura: este workflow não precisa escrever em nada (e PRs de fork rodam sem segredos).
permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # se o 3.10 falhar, ainda queremos ver o resultado do 3.12
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  evals:
    name: evals (trava de regressão)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Sai com 1 se um acerto virou erro (ou um caso sumiu) e com 2 se a baseline está desatualizada.
      # O resultado aparece no resumo da execução ($GITHUB_STEP_SUMMARY).
      - run: python evals/run_evals.py --verificar
