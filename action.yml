name: Sentinela
description: Revisor de segurança para pull requests. Aponta vulnerabilidades nas linhas adicionadas e comenta no PR.
author: Kako1995
branding:
  icon: shield
  color: red

inputs:
  github-token:
    description: Token usado para comentar no PR.
    default: ${{ github.token }}
  excluir:
    description: 'Caminhos a ignorar, separados por espaço. Ex.: "tests docs".'
    default: ""
  python-version:
    description: Versão do Python.
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Instalar o Sentinela
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$ACTION_PATH"

    - name: Revisar o diff do PR
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        EXCLUIR: ${{ inputs.excluir }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash "$ACTION_PATH/.github/scripts/revisar_pr.sh"
