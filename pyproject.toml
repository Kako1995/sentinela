[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinela"
version = "0.1.0"
description = "Revisor de segurança para diffs de código: regras e análise de AST (Python, JavaScript, TypeScript), sem IA."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tomli>=2; python_version < '3.11'",  # tomllib só entrou na biblioteca padrão no 3.11
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sentinela = "sentinela.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
